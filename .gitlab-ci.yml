stages:
  - check
  - build
variables:
  NIX_BUILD_SHELL: "/bin/bash"
treefmt:
  stage: check
  timeout: 1h
  tags:
    - bigdatalab-kubernetes
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" fmt -- --fail-on-change
worker:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-kubernetes
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#worker
vm_workernode:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-kubernetes
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#vm_workernode
head:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-kubernetes
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#head
vm_headnode:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-kubernetes
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#vm_headnode
