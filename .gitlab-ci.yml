stages:
  - check
  - depends
  - build
variables:
  NIX_BUILD_SHELL: "/bin/bash"
treefmt:
  stage: check
  timeout: 1h
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" fmt -- --fail-on-change
slurm-node-exporter:
  stage: depends
  timeout: 10m
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#devel.sne
sdc-hitman:
  stage: depends
  timeout: 10m
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#devel.sdc-hitman
docs:
  stage: build
  timeout: 10m
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#devel.docs --out-link result
    - mkdir -p artifacts
    - cp -aL result/. artifacts/
  artifacts:
    name: "docs-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expose_as: "Documentation"
    paths:
      - artifacts/
worker:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#worker
vm_workernode:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#vm_workernode
head:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#head
vm_headnode:
  stage: build
  timeout: 1h
  tags:
    - bigdatalab-sdc
  image: nixos/nix
  script:
    - nix --accept-flake-config --extra-experimental-features "nix-command flakes" build .#vm_headnode
