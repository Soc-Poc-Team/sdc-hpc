stages: # List of stages for jobs, and their order of execution
  - dependencies
  - build
  - create
  - deploy
variables:
  NIXPKGS_ALLOW_UNFREE: "1" # Allow unfree packages in Nix
  NIX_BUILD_SHELL: "/bin/bash" # Ensure we're using bash for shell commands
  PODMAN_VERSION: "v4.6"
  NIX_BUILD_CORES: 2
ci-image:
  stage: dependencies
  timeout: 3h
  variables:
    RUNNER_SCRIPT_TIMEOUT: 3h
  tags:
    - hpc-on-demand
  image: quay.io/containers/podman:$PODMAN_VERSION
  #before_script:
  #  - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build --file ci/Containerfile.ci --cache-from $CI_REGISTRY_IMAGE/cache/ci-image --cache-to $CI_REGISTRY_IMAGE/cache/ci-image --tag $CI_REGISTRY_IMAGE/ci-image:latest .
    - podman push $CI_REGISTRY_IMAGE/ci-image:latest
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
      changes:
        - ci/Containerfile.ci
    - when: manual
      allow_failure: true
ci-worker-image:
  stage: dependencies
  tags:
    - hpc-on-demand
  image: quay.io/containers/podman:$PODMAN_VERSION
  before_script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman build --file ci/ContainerfileWorker.ci --cache-from $CI_REGISTRY_IMAGE/cache/ci-worker-image --cache-to $CI_REGISTRY_IMAGE/cache/ci-worker-image --tag $CI_REGISTRY_IMAGE/ci-worker-image:latest .
    - podman push $CI_REGISTRY_IMAGE/ci-worker-image:latest
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
      changes:
        - ci/ContainerfileWorker.ci
    - when: manual
      allow_failure: true
ci-curl-image:
  stage: dependencies
  tags:
    - hpc-on-demand
  image: quay.io/containers/podman:$PODMAN_VERSION
  before_script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman build --file ci/ContainerCurlJq.ci --cache-from $CI_REGISTRY_IMAGE/cache/ci-curl-image --cache-to $CI_REGISTRY_IMAGE/cache/ci-curl-image --tag $CI_REGISTRY_IMAGE/ci-curl-image:latest .
    - podman push $CI_REGISTRY_IMAGE/ci-curl-image:latest
  rules:
    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
      changes:
        - ci/ContainerCurlJq.ci
    - when: manual
      allow_failure: true
# Job for headnode ISO build and upload
build-headnode:
  stage: build
  image: $CI_REGISTRY_IMAGE/ci-image:latest
  tags:
    - hpc-on-demand
  rules:
    - changes:
        - roles/headnode/**/*
        - common/**/*
        - config.toml
      when: always
  script:
    - echo "Building headnode ISO"
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_AUTHKEY\"/\"$TAILSCALE_AUTHKEY\"/" config.toml
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_APIKEY\"/\"$TAILSCALE_APIKEY\"/" config.toml
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_DOMAIN\"/\"$TAILSCALE_DOMAIN\"/" config.toml
    - nix build --accept-flake-config
    - mv result/iso/*.iso /tmp/nixos_headnode.iso # Move the headnode ISO to /tmp
    - nix shell nixpkgs#jq -c bash ci/api.sh /tmp/nixos_headnode.iso # Upload the workernode ISO
# Job for workernode ISO build and upload
build-workernode:
  stage: build
  #image: $CI_REGISTRY_IMAGE/ci-worker-image:latest
  image: $CI_REGISTRY_IMAGE/ci-image:latest
  tags:
    - hpc-on-demand
  rules:
    - changes:
        - roles/workernode/**/*
        - common/**/*
        - config.toml
      when: always
  script:
    - echo "Building workernode ISO"
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_AUTHKEY\"/\"$TAILSCALE_AUTHKEY\"/" config.toml
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_APIKEY\"/\"$TAILSCALE_APIKEY\"/" config.toml
    - nix shell nixpkgs#gnused -c sed -i "s/\"TS_DOMAIN\"/\"$TAILSCALE_DOMAIN\"/" config.toml
    - nix build .#worker --accept-flake-config
    - mv result/iso/*.iso /tmp/nixos_workernode.iso # Move the workernode ISO to /tmp
    - nix shell nixpkgs#jq -c bash ci/api.sh /tmp/nixos_workernode.iso # Upload the workernode ISO
# Job to redeploy the headnode VM (VMID=201)
redeploy-headnode:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/ci-curl-image:latest
  tags:
    - hpc-on-demand
  script:
    - sh ci/redeploy.sh 201 local:iso/nixos_headnode.iso
  rules:
    - when: manual
      allow_failure: true
  needs:
    - job: build-headnode
      optional: true
# Job to redeploy the workernode VM (VMID=202)
redeploy-workernode:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/ci-curl-image:latest
  tags:
    - hpc-on-demand
  script:
    - sh ci/redeploy.sh 202 local:iso/nixos_workernode.iso
  rules:
    - when: manual
      allow_failure: true
  needs:
    - job: build-workernode
      optional: true
creation-headnode-job:
  stage: create
  image: $CI_REGISTRY_IMAGE/ci-curl-image:latest
  tags:
    - hpc-on-demand
  script:
    - bash ci/create.sh "Headnode" 201 "local:iso/nixos_headnode.iso"
  rules:
    - when: manual
      allow_failure: true
creation-workernode-job:
  stage: create
  image: $CI_REGISTRY_IMAGE/ci-curl-image:latest
  tags:
    - hpc-on-demand
  script:
    - bash ci/create.sh "Worker1" 202 "local:iso/nixos_workernode.iso"
  rules:
    - when: manual
      allow_failure: true
