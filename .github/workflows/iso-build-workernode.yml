on:
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "roles/workernode/**/*"
      - "common/**/*"
  pull_request:
    branches:
      - main
    paths:
      - "config.json"
      - "roles/workernode/**/*"
      - "common/**/*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-workernode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell nixpkgs#gnused -c sed -i "s/\"TS_AUTHKEY\"/\"$TAILSCALE_AUTHKEY\"/" config.json
      - run: nix build .#worker1 --accept-flake-config
      - name: Upload workernode ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: workernode-iso.iso
          path: result/iso/workernode.iso
