[wifi]
enabled = true
ssid = "SSID"
pwd = "PASSWORD"

[tailscale]
domain = "TS_DOMAIN"
authKey = "TS_AUTHKEY"
apiKey = "TS_APIKEY"

[headnode]
grafana_enable_admin = false
grafana_admin = "admin"
# This password is readable from the nix store!
grafana_password = "admin"

[worker]
# If set to false, unique mac based hostnames will be used 
acceptDHCPHostnames = false
# Workers will start their cluster services only after they reached the headnode
awaitHeadnode = true
# Shows the journal on tty1
showJournal = false
# Timeout in seconds to reach headnode before giving up
headnodeTimeout = 900

